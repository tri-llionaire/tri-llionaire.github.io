<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatroom</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #313338;
  color: #f2f3f5;
}

body { overflow: hidden; }

.app {
  display: flex;
  width: 100%;
  height: 100vh;
}

.sidebar {
  width: 250px;
  background: #2b2d31;
  border-right: 1px solid #202225;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.server-header {
  height: 60px;
  padding: 0 18px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid #202225;
  font-size: 17px;
  font-weight: 700;
}

.server-icon {
  width: 28px;
  height: 28px;
  margin-right: 10px;
  border-radius: 7px;
  background: #5865f2;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sidebar-content {
  padding: 18px 10px;
  flex: 1;
  overflow-y: auto;
}

.sidebar-label,
.members-title {
  padding: 0 8px 8px;
  color: #949ba4;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
}

.thread {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 10px;
  margin-bottom: 3px;
  border-radius: 5px;
  color: #b5bac1;
  cursor: pointer;
  font-size: 14px;
}

.thread:hover {
  background: #35373c;
  color: #dbdee1;
}

.thread.active {
  background: #404249;
  color: #fff;
}

.thread-icon {
  color: #949ba4;
  font-size: 17px;
  flex-shrink: 0;
}

.thread-name {
  min-width: 0;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.delete-thread {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: #72767d;
  font-size: 18px;
  line-height: 20px;
  cursor: pointer;
  opacity: 0;
}

.thread:hover .delete-thread,
.thread.active .delete-thread {
  opacity: 1;
}

.delete-thread:hover {
  background: #ed4245;
  color: white;
}

.new-thread {
  width: calc(100% - 16px);
  margin: 12px 8px 0;
  padding: 9px 12px;
  border: 1px solid #4a4d55;
  border-radius: 5px;
  background: transparent;
  color: #dbdee1;
  cursor: pointer;
}

.new-thread:hover {
  background: #35373c;
}

.user-panel {
  min-height: 62px;
  padding: 10px 14px;
  background: #232428;
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #5865f2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
}

.user-name {
  font-size: 13px;
  font-weight: 600;
}

.user-status {
  color: #23a559;
  font-size: 11px;
  margin-top: 2px;
}

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.chat-header {
  height: 60px;
  padding: 0 22px;
  display: flex;
  align-items: center;
  border-bottom: 1px solid #202225;
  flex-shrink: 0;
}

.thread-title {
  display: flex;
  align-items: center;
  min-width: 0;
}

.thread-title-icon {
  color: #949ba4;
  font-size: 22px;
  margin-right: 8px;
}

.thread-title-text {
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.thread-subtitle {
  margin-left: 12px;
  color: #72767d;
  font-size: 12px;
}

.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 22px 26px 12px;
}

.message {
  display: flex;
  gap: 12px;
  max-width: 1000px;
  margin-bottom: 20px;
}

.message-avatar {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: white;
}

.message-body {
  min-width: 0;
  padding-top: 1px;
}

.message-header {
  display: flex;
  align-items: baseline;
  gap: 7px;
}

.message-author {
  font-size: 14px;
  font-weight: 700;
}

.message-time {
  color: #72767d;
  font-size: 10px;
}

.message-text {
  margin-top: 3px;
  color: #dbdee1;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  text-align: left;
}

.you { background: #5865f2; }
.chatgpt { background: #10a37f; }
.claude { background: #d97757; }
.deepseek { background: #4f7cff; }
.grok { background: #111; }
.gemini { background: #4285f4; }
.gptoss { background: #6b7280; }
.nemotron { background: #7c3aed; }

.error-message .message-text {
  color: #ff8a8a;
}

.input-area {
  padding: 8px 20px 18px;
  flex-shrink: 0;
}

.input-container {
  max-width: 1100px;
  margin: 0 auto;
  min-height: 48px;
  display: flex;
  align-items: flex-end;
  padding: 10px 10px 10px 14px;
  background: #383a40;
  border-radius: 7px;
}

textarea {
  flex: 1;
  min-height: 24px;
  max-height: 140px;
  padding: 2px 0;
  border: 0;
  outline: 0;
  resize: none;
  background: transparent;
  color: #f2f3f5;
  font-family: inherit;
  font-size: 14px;
  line-height: 20px;
}

textarea::placeholder {
  color: #72767d;
}

.send-button {
  margin-left: 10px;
  padding: 8px 14px;
  border: 0;
  border-radius: 5px;
  background: #5865f2;
  color: white;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.send-button:hover {
  background: #4752c4;
}

.send-button:disabled {
  opacity: .55;
  cursor: not-allowed;
}

.members {
  width: 280px;
  padding: 20px 14px;
  background: #2b2d31;
  border-left: 1px solid #202225;
  flex-shrink: 0;
  overflow-y: auto;
}

.member {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 6px;
  color: #b5bac1;
  font-size: 13px;
}

.member-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-size: 11px;
  font-weight: 700;
  flex-shrink: 0;
}

.member-info {
  min-width: 0;
  flex: 1;
}

.member-name {
  color: #dbdee1;
  font-weight: 600;
}

.member-model {
  color: #72767d;
  font-size: 10px;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.member-right {
  display: flex;
  align-items: center;
  gap: 7px;
}

.member-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #72767d;
}

.member-dot.ready {
  background: #23a559;
}

.member-dot.missing {
  background: #ed4245;
}

.toggle {
  position: relative;
  width: 38px;
  height: 22px;
  flex-shrink: 0;
}

.toggle input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  inset: 0;
  border-radius: 22px;
  background: #4f545c;
  cursor: pointer;
  transition: .15s;
}

.slider::before {
  content: "";
  position: absolute;
  width: 16px;
  height: 16px;
  left: 3px;
  top: 3px;
  border-radius: 50%;
  background: white;
  transition: .15s;
}

.toggle input:checked + .slider {
  background: #5865f2;
}

.toggle input:checked + .slider::before {
  transform: translateX(16px);
}

.backend-status {
  margin: 14px 6px 0;
  padding-top: 12px;
  border-top: 1px solid #404249;
  color: #72767d;
  font-size: 10px;
  line-height: 1.4;
}

.backend-status.connected {
  color: #23a559;
}

.backend-status.disconnected {
  color: #ed4245;
}

/* --------------------------------------------------
   MODALS
-------------------------------------------------- */

.modal-overlay {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.65);
  z-index: 20;
}

.modal-overlay.open {
  display: flex;
}

.modal {
  width: min(460px, calc(100% - 30px));
  background: #2b2d31;
  border-radius: 8px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}

.modal-header {
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #202225;
}

.modal-title {
  font-size: 16px;
  font-weight: 700;
}

.modal-subtitle {
  color: #949ba4;
  font-size: 12px;
  margin-top: 4px;
}

.modal-close {
  border: 0;
  background: transparent;
  color: #949ba4;
  font-size: 24px;
  cursor: pointer;
}

.modal-close:hover {
  color: #fff;
}

.modal-body {
  padding: 20px;
}

.modal-body label {
  display: block;
  margin-bottom: 8px;
  color: #dbdee1;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.modal-body input {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid #1f2023;
  border-radius: 5px;
  outline: none;
  background: #1e1f22;
  color: #f2f3f5;
  font-size: 14px;
}

.modal-warning {
  color: #dbdee1;
  font-size: 14px;
  line-height: 1.5;
}

.modal-warning strong {
  color: #fff;
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding: 14px 20px;
  background: #232428;
  border-radius: 0 0 8px 8px;
}

.modal-cancel,
.modal-create,
.modal-delete {
  padding: 8px 14px;
  border: 0;
  border-radius: 5px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.modal-cancel {
  background: transparent;
  color: #dbdee1;
}

.modal-cancel:hover {
  background: #35373c;
}

.modal-create {
  background: #5865f2;
  color: white;
}

.modal-create:hover {
  background: #4752c4;
}

.modal-delete {
  background: #ed4245;
  color: white;
}

.modal-delete:hover {
  background: #c93639;
}

::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: #1e1f22;
  border-radius: 4px;
}

@media (max-width: 1050px) {
  .members {
    width: 250px;
  }

  .sidebar {
    width: 220px;
  }
}

@media (max-width: 760px) {
  .members {
    display: none;
  }
}

@media (max-width: 600px) {
  .sidebar {
    display: none;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="server-header">
      <div class="server-icon">✦</div>
      AI Chatroom
    </div>

    <div class="sidebar-content">

      <div class="sidebar-label">
        Threads
      </div>

      <div id="threadList"></div>

      <button class="new-thread" id="newThreadButton">
        + New Thread
      </button>

    </div>

    <div class="user-panel">
      <div class="user-avatar">Y</div>

      <div>
        <div class="user-name">You</div>
        <div class="user-status">Online</div>
      </div>
    </div>

  </aside>

  <main class="main">

    <header class="chat-header">

      <div class="thread-title">

        <span class="thread-title-icon">#</span>

        <span
          id="threadTitle"
          class="thread-title-text"
        >
          AI Discussion
        </span>

        <span class="thread-subtitle">
          All enabled AIs respond
        </span>

      </div>

    </header>

    <section
      class="messages"
      id="messages"
    ></section>

    <div class="input-area">

      <div class="input-container">

        <textarea
          id="messageInput"
          rows="1"
          placeholder="Message this thread..."
        ></textarea>

        <button
          class="send-button"
          id="sendButton"
        >
          Send
        </button>

      </div>

    </div>

  </main>

  <aside class="members">

    <div class="members-title">
      AI Participants
    </div>

    <div id="providerList"></div>

    <div
      id="backendStatus"
      class="backend-status"
    >
      Checking backend...
    </div>

  </aside>

</div>


<!-- CREATE THREAD MODAL -->

<div
  class="modal-overlay"
  id="newThreadModal"
>

  <div class="modal">

    <div class="modal-header">

      <div>
        <div class="modal-title">
          Create a new thread
        </div>

        <div class="modal-subtitle">
          Start a new conversation with your AI participants.
        </div>
      </div>

      <button
        class="modal-close"
        id="modalClose"
      >
        ×
      </button>

    </div>

    <div class="modal-body">

      <label for="newThreadName">
        Thread name
      </label>

      <input
        id="newThreadName"
        type="text"
        placeholder="e.g. Quantum Computing"
        autocomplete="off"
      >

    </div>

    <div class="modal-footer">

      <button
        class="modal-cancel"
        id="modalCancel"
      >
        Cancel
      </button>

      <button
        class="modal-create"
        id="modalCreate"
      >
        Create Thread
      </button>

    </div>

  </div>

</div>


<!-- DELETE THREAD MODAL -->

<div
  class="modal-overlay"
  id="deleteThreadModal"
>

  <div class="modal">

    <div class="modal-header">

      <div>
        <div class="modal-title">
          Delete this thread?
        </div>

        <div class="modal-subtitle">
          This action cannot be undone.
        </div>
      </div>

      <button
        class="modal-close"
        id="deleteModalClose"
      >
        ×
      </button>

    </div>

    <div class="modal-body">

      <div
        class="modal-warning"
        id="deleteThreadText"
      >
        This will permanently delete the thread and all of its messages.
      </div>

    </div>

    <div class="modal-footer">

      <button
        class="modal-cancel"
        id="deleteModalCancel"
      >
        Cancel
      </button>

      <button
        class="modal-delete"
        id="deleteModalConfirm"
      >
        Delete Thread
      </button>

    </div>

  </div>

</div>


<script>

const API = "https://dylan-subsequently-enb-guy.trycloudflare.com/api";

const PROVIDERS = {

  chatgpt: {
    name: "GPT-5.6 Luna",
    avatar: "G",
    type: "chatgpt"
  },

  grok: {
    name: "Grok 4.6",
    avatar: "X",
    type: "grok"
  },

  deepseek: {
    name: "DeepSeek Flash",
    avatar: "D",
    type: "deepseek"
  },

  claude: {
    name: "Claude Sonnet 4.6",
    avatar: "C",
    type: "claude"
  },

  gemini: {
    name: "Gemini 3.8 Flash",
    avatar: "G",
    type: "gemini"
  },

  gptoss: {
    name: "GPT-OSS 120B",
    avatar: "O",
    type: "gptoss"
  },

  nemotron: {
    name: "Nemotron 3 Ultra",
    avatar: "N",
    type: "nemotron"
  }

};

const ENABLED_KEY = "aiChatroomEnabledProviders";

let threads = [];
let activeThreadId = null;
let providerStatus = {};
let enabledProviders = loadEnabledProviders();
let sending = false;
let pendingDeleteThreadId = null;


function loadEnabledProviders() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(ENABLED_KEY)
      );

    if (Array.isArray(saved)) {

      return new Set(
        saved.filter(
          id => PROVIDERS[id]
        )
      );

    }

  } catch (error) {

    console.warn(
      "Could not load AI toggle settings.",
      error
    );

  }

  return new Set(
    Object.keys(PROVIDERS)
  );

}


function saveEnabledProviders() {

  localStorage.setItem(
    ENABLED_KEY,
    JSON.stringify(
      [...enabledProviders]
    )
  );

}


async function api(path, options = {}) {

  const response =
    await fetch(
      API + path,
      {
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        },
        ...options
      }
    );

  const data =
    await response
      .json()
      .catch(() => ({}));

  if (!response.ok) {

    throw new Error(
      data.error ||
      `HTTP ${response.status}`
    );

  }

  return data;

}


function formatTime(iso) {

  if (!iso) return "";

  return new Date(iso)
    .toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

}


function renderThreads() {

  const list =
    document.getElementById(
      "threadList"
    );

  list.innerHTML = "";

  threads.forEach(thread => {

    const element =
      document.createElement("div");

    element.className = "thread";

    if (
      thread.id === activeThreadId
    ) {
      element.classList.add("active");
    }


    const icon =
      document.createElement("span");

    icon.className =
      "thread-icon";

    icon.textContent = "#";


    const title =
      document.createElement("span");

    title.className =
      "thread-name";

    title.textContent =
      thread.title;


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-thread";

    deleteButton.type =
      "button";

    deleteButton.textContent =
      "×";

    deleteButton.title =
      "Delete thread";


    deleteButton.addEventListener(
      "click",
      event => {

        event.stopPropagation();

        openDeleteThreadModal(
          thread.id,
          thread.title
        );

      }
    );


    element.appendChild(icon);
    element.appendChild(title);
    element.appendChild(deleteButton);


    element.addEventListener(
      "click",
      () => loadThread(thread.id)
    );


    list.appendChild(element);

  });

}


function renderProviderToggles() {

  const list =
    document.getElementById(
      "providerList"
    );

  list.innerHTML = "";


  Object.entries(PROVIDERS)
    .forEach(
      ([id, provider]) => {

        const row =
          document.createElement("div");

        row.className =
          "member";


        const avatar =
          document.createElement("div");

        avatar.className =
          `member-avatar ${provider.type}`;

        avatar.textContent =
          provider.avatar;


        const info =
          document.createElement("div");

        info.className =
          "member-info";


        const name =
          document.createElement("div");

        name.className =
          "member-name";

        name.textContent =
          provider.name;


        const model =
          document.createElement("div");

        model.className =
          "member-model";

        model.textContent =
          providerStatus[id]?.model ||
          "Not checked";


        info.appendChild(name);
        info.appendChild(model);


        const right =
          document.createElement("div");

        right.className =
          "member-right";


        const dot =
          document.createElement("div");

        dot.className =
          "member-dot " +
          (
            providerStatus[id]?.configured
              ? "ready"
              : "missing"
          );

        dot.title =
          providerStatus[id]?.configured
            ? "API key configured"
            : "API key not configured";


        const label =
          document.createElement("label");

        label.className =
          "toggle";


        const checkbox =
          document.createElement("input");

        checkbox.type =
          "checkbox";

        checkbox.checked =
          enabledProviders.has(id);


        checkbox.addEventListener(
          "change",
          () => {

            if (checkbox.checked) {

              enabledProviders.add(id);

            } else {

              enabledProviders.delete(id);

            }

            saveEnabledProviders();

          }
        );


        const slider =
          document.createElement("span");

        slider.className =
          "slider";


        label.appendChild(checkbox);
        label.appendChild(slider);

        right.appendChild(dot);
        right.appendChild(label);

        row.appendChild(avatar);
        row.appendChild(info);
        row.appendChild(right);

        list.appendChild(row);

      }
    );

}


function updateBackendStatus(
  connected,
  text
) {

  const element =
    document.getElementById(
      "backendStatus"
    );

  element.textContent =
    text;

  element.className =
    "backend-status " +
    (
      connected
        ? "connected"
        : "disconnected"
    );

}


async function checkHealth() {

  try {

    const health =
      await api("/health");

    providerStatus =
      health.providers || {};

    updateBackendStatus(
      true,
      "Backend connected"
    );

    renderProviderToggles();

  } catch (error) {

    providerStatus = {};

    updateBackendStatus(
      false,
      "Backend unavailable"
    );

    renderProviderToggles();

    console.error(error);

  }

}


async function loadThreads() {

  threads =
    await api("/threads");


  if (threads.length === 0) {

    const created =
      await api(
        "/threads",
        {
          method: "POST",
          body: JSON.stringify({
            title: "AI Discussion"
          })
        }
      );

    threads = [created];

  }


  if (
    !activeThreadId ||
    !threads.some(
      t => t.id === activeThreadId
    )
  ) {

    activeThreadId =
      threads[0].id;

  }


  renderThreads();

  await loadThread(
    activeThreadId
  );

}


async function loadThread(id) {

  const data =
    await api(
      `/threads/${encodeURIComponent(id)}`
    );

  const thread =
    data.thread;

  const messages =
    data.messages || [];


  if (!thread) {

    throw new Error(
      "Thread data was missing from the server response."
    );

  }


  activeThreadId =
    thread.id;


  document.getElementById(
    "threadTitle"
  ).textContent =
    thread.title;


  renderThreads();

  renderMessages(messages);

}


function renderMessages(messages) {

  const container =
    document.getElementById(
      "messages"
    );

  container.innerHTML = "";

  messages.forEach(
    renderMessage
  );

  container.scrollTop =
    container.scrollHeight;

}


function renderMessage(message) {

  const container =
    document.getElementById(
      "messages"
    );


  const element =
    document.createElement("div");

  element.className =
    "message";


  if (
    String(message.text)
      .startsWith("AI error:")
  ) {

    element.classList.add(
      "error-message"
    );

  }


  const avatar =
    document.createElement("div");

  avatar.className =
    `message-avatar ${message.type}`;

  avatar.textContent =
    message.avatar;


  const body =
    document.createElement("div");

  body.className =
    "message-body";


  const header =
    document.createElement("div");

  header.className =
    "message-header";


  const author =
    document.createElement("span");

  author.className =
    "message-author";

  author.textContent =
    message.author;


  const time =
    document.createElement("span");

  time.className =
    "message-time";

  time.textContent =
    formatTime(
      message.created_at
    );


  const text =
    document.createElement("div");

  text.className =
    "message-text";

  text.textContent =
    String(message.text).trim();


  header.appendChild(author);
  header.appendChild(time);

  body.appendChild(header);
  body.appendChild(text);

  element.appendChild(avatar);
  element.appendChild(body);

  container.appendChild(element);

}


function addTemporaryMessage(
  author,
  type,
  avatar,
  text
) {

  renderMessage({
    author,
    type,
    avatar,
    text,
    created_at: new Date().toISOString()
  });

}


function openNewThreadModal() {

  const modal =
    document.getElementById(
      "newThreadModal"
    );

  const input =
    document.getElementById(
      "newThreadName"
    );

  input.value = "";

  modal.classList.add("open");

  setTimeout(
    () => input.focus(),
    0
  );

}


function closeNewThreadModal() {

  document
    .getElementById(
      "newThreadModal"
    )
    .classList.remove("open");

}


async function createThread() {

  const input =
    document.getElementById(
      "newThreadName"
    );

  const title =
    input.value.trim();


  if (!title) {

    input.focus();

    return;

  }


  try {

    const created =
      await api(
        "/threads",
        {
          method: "POST",
          body: JSON.stringify({
            title
          })
        }
      );

    threads.unshift(created);

    activeThreadId =
      created.id;

    closeNewThreadModal();

    renderThreads();

    await loadThread(
      created.id
    );

  } catch (error) {

    addTemporaryMessage(
      "System",
      "you",
      "!",
      `Could not create thread: ${error.message}`
    );

  }

}


function openDeleteThreadModal(
  id,
  title
) {

  pendingDeleteThreadId =
    id;


  const text =
    document.getElementById(
      "deleteThreadText"
    );


  text.innerHTML =
    `Delete <strong>${escapeHtml(title)}</strong>?<br><br>` +
    `This will permanently delete the thread and all of its messages.`;


  document
    .getElementById(
      "deleteThreadModal"
    )
    .classList.add("open");

}


function closeDeleteThreadModal() {

  pendingDeleteThreadId =
    null;

  document
    .getElementById(
      "deleteThreadModal"
    )
    .classList.remove("open");

}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


async function confirmDeleteThread() {

  const id =
    pendingDeleteThreadId;

  if (!id) return;


  try {

    try {

      await api(
        `/threads/${encodeURIComponent(id)}`,
        {
          method: "DELETE"
        }
      );

    } catch (deleteError) {

      // If the backend says it's already gone, that's fine -
      // the desired end state (thread deleted) is reached either way.
      // Only re-throw genuine failures.
      if (
        !/not found/i.test(
          deleteError.message || ""
        )
      ) {
        throw deleteError;
      }

    }


    // Always re-fetch from the server instead of trusting the
    // local array, so SQLite stays the single source of truth
    // and the UI can never hang onto a stale thread ID.
    threads =
      await api("/threads");


    closeDeleteThreadModal();


    if (threads.length === 0) {

      const created =
        await api(
          "/threads",
          {
            method: "POST",
            body: JSON.stringify({
              title: "AI Discussion"
            })
          }
        );

      threads = [created];

    }


    if (
      activeThreadId === id ||
      !threads.some(
        thread => thread.id === activeThreadId
      )
    ) {

      activeThreadId =
        threads[0].id;

      renderThreads();

      await loadThread(
        activeThreadId
      );

    } else {

      renderThreads();

    }

  } catch (error) {

    closeDeleteThreadModal();

    addTemporaryMessage(
      "System",
      "you",
      "!",
      `Could not delete thread: ${error.message}`
    );

  }

}


async function sendMessage() {

  if (sending) return;


  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();


  if (
    !text ||
    !activeThreadId
  ) {
    return;
  }


  const selectedProviders =
    [...enabledProviders];


  if (
    selectedProviders.length === 0
  ) {

    addTemporaryMessage(
      "System",
      "you",
      "!",
      "Enable at least one AI before sending a message."
    );

    return;

  }


  sending = true;


  const sendButton =
    document.getElementById(
      "sendButton"
    );

  sendButton.disabled = true;


  input.value = "";


  try {

    const userMessage =
      await api(
        `/threads/${encodeURIComponent(activeThreadId)}/messages`,
        {
          method: "POST",
          body: JSON.stringify({
            author: "You",
            type: "you",
            avatar: "Y",
            text
          })
        }
      );


    renderMessage(
      userMessage
    );


    const result =
      await api(
        `/threads/${encodeURIComponent(activeThreadId)}/ask-all`,
        {
          method: "POST",
          body: JSON.stringify({
            providers:
              selectedProviders
          })
        }
      );


    const failed =
      result.results
        .filter(
          item => !item.success
        )
        .length;


    if (failed > 0) {

      console.log(
        `${failed} AI provider(s) failed.`
      );

    }


    await loadThread(
      activeThreadId
    );

  } catch (error) {

    addTemporaryMessage(
      "System",
      "you",
      "!",
      `Could not send message: ${error.message}`
    );

  } finally {

    sending = false;

    sendButton.disabled = false;

    input.focus();

  }

}


document
  .getElementById(
    "newThreadButton"
  )
  .addEventListener(
    "click",
    openNewThreadModal
  );


document
  .getElementById(
    "modalClose"
  )
  .addEventListener(
    "click",
    closeNewThreadModal
  );


document
  .getElementById(
    "modalCancel"
  )
  .addEventListener(
    "click",
    closeNewThreadModal
  );


document
  .getElementById(
    "modalCreate"
  )
  .addEventListener(
    "click",
    createThread
  );


document
  .getElementById(
    "deleteModalClose"
  )
  .addEventListener(
    "click",
    closeDeleteThreadModal
  );


document
  .getElementById(
    "deleteModalCancel"
  )
  .addEventListener(
    "click",
    closeDeleteThreadModal
  );


document
  .getElementById(
    "deleteModalConfirm"
  )
  .addEventListener(
    "click",
    confirmDeleteThread
  );


document
  .getElementById(
    "newThreadModal"
  )
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "newThreadModal"
      ) {
        closeNewThreadModal();
      }

    }
  );


document
  .getElementById(
    "deleteThreadModal"
  )
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id ===
        "deleteThreadModal"
      ) {
        closeDeleteThreadModal();
      }

    }
  );


document
  .getElementById(
    "sendButton"
  )
  .addEventListener(
    "click",
    sendMessage
  );


document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


document
  .getElementById(
    "newThreadName"
  )
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        createThread();

      }

      if (
        event.key === "Escape"
      ) {

        closeNewThreadModal();

      }

    }
  );


document
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Escape"
      ) {

        closeNewThreadModal();
        closeDeleteThreadModal();

      }

    }
  );


async function initialize() {

  renderProviderToggles();

  await checkHealth();

  try {

    await loadThreads();

  } catch (error) {

    console.error(error);

    updateBackendStatus(
      false,
      "Could not load chatroom"
    );

    addTemporaryMessage(
      "System",
      "you",
      "!",
      `Could not connect to the backend: ${error.message}`
    );

  }

}


initialize();

</script>
